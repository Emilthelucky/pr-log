name: pull-shark

on:
  schedule:
    - cron: '7,37 * * * *'   # backup only — GitHub often delays/skips scheduled runs
  workflow_dispatch:          # manual start; the job also re-dispatches itself

concurrency: pull-shark       # one run at a time (a newer one waits as "pending")

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # GitHub hard limit is 360
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      TARGET: 1024
      MAX_MINUTES: 300        # stop the loop before the 6h job limit, then re-dispatch
      PAIR_TARGET: 48
      CO_AUTHOR: "Aditya Sharma <67048929+extinctsion@users.noreply.github.com>"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Create and merge PRs
        run: |
          login=$(gh api user -q .login)
          id=$(gh api user -q .id)
          git config user.name "$login"
          git config user.email "${id}+${login}@users.noreply.github.com"
          base=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          deadline=$(( $(date +%s) + MAX_MINUTES * 60 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            git checkout -q "$base"
            git pull -q origin "$base" || { sleep 10; continue; }

            n=$(cat count.txt 2>/dev/null || echo 0)
            if [ "$n" -ge "$TARGET" ]; then
              echo "Target reached: $n"
              exit 0
            fi
            n=$((n + 1))
            branch="pr-$n-$(date +%s)"

            git checkout -q -b "$branch"
            echo "$n" > count.txt
            echo "- $(date -u +%Y-%m-%dT%H:%M:%SZ) #$n" >> log.md
            git add count.txt log.md

            p=$(cat pair.txt 2>/dev/null || echo 0)
            if [ "$p" -lt "$PAIR_TARGET" ]; then
              echo "$((p + 1))" > pair.txt
              git add pair.txt
              git commit -q -m "Update log #$n" -m "Co-authored-by: $CO_AUTHOR"
            else
              git commit -q -m "Update log #$n"
            fi

            if ! git push -q origin "$branch"; then
              echo "push failed, retrying"; sleep 15; continue
            fi

            if ! gh pr create --base "$base" --head "$branch" \
                 --title "Update log #$n" --body "Automated update #$n"; then
              echo "pr create failed, retrying"
              git push -q origin --delete "$branch" || true
              sleep 30; continue
            fi

            # GitHub often needs a few seconds to compute mergeability.
            # "Base branch was modified" used to kill the whole run here.
            merged=0
            for attempt in 1 2 3 4 5 6; do
              sleep $((attempt * 3))
              if gh pr merge "$branch" --merge --delete-branch; then
                merged=1; break
              fi
              echo "merge attempt $attempt failed"
            done

            if [ "$merged" -eq 1 ]; then
              echo "PR #$n merged"
            else
              echo "Could not merge #$n, closing it and continuing"
              gh pr close "$branch" --delete-branch || true
              sleep 30
            fi
            sleep 6
          done

          echo "Time budget used, handing over to a new run"

      - name: Re-dispatch if target not reached
        if: success() || failure()   # not when you cancel it manually
        run: |
          git pull -q origin HEAD || true
          n=$(cat count.txt 2>/dev/null || echo 0)
          if [ "$n" -lt "$TARGET" ]; then
            gh workflow run pull-shark.yml --ref "${GITHUB_REF_NAME}"
            echo "Re-dispatched at $n/$TARGET"
          fi
